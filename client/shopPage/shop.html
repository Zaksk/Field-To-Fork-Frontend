    <meta charset="UTF-8">

    <link rel="stylesheet" href="../shopPage/shop.css">
    <script defer src="../settings.js"></script>
    <script defer src="./shop.js"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../assets/field2forklogo.jpg" class="field2fork-logo" style="max-height: 50px; width: auto;">
            </a>
            <button class="btn btn-success" id="dataBtn">View historic price ranges</button>
            <div class="search-bar d-flex flex-grow-1 justify-content-end">
                <input type="text" class="form-control me-2 w-50" placeholder="Search" id="searchBox">
                <button class="btn btn-success">Search</button>
            </div>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>

    <div class="banner"></div>
    
    <div class="d-flex justify-content-between" style="padding: 10px">
        <div class="add-product">
            <button class="add-product-btn btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">Add new product</button>
        </div>
        <button class="btn btn-success" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">Shopping cart</button>
        

        <!-- Shopping Cart Offcanvas -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasRightLabel">Shopping cart</h5>

            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="item"></div>
            <h5>Total: £<span id="cartTotal">0.00</span></h5>
        </div>
        <button class="btn btn-success">Proceed to checkout</button>
        </div>
    </div>

    

<!-- side bar -->
    <main class="d-flex main-sidebar">
        <section class="sidebar d-flex flex-column">
            <h5 class="text-center">Filter by category</h5>
            <div class="filter-container">  
                <input type="radio" name="product" value="all" id="all" checked/>
                <label for="all">All</label>
                <br>
                <input type="radio" name="product" value="fruit" id="fruit"/>
                <label for="fruit">Fresh Fruit</label>
                <br>
                <input type="radio" name="product" value="vegetable" id="vegetable"/>
                <label for="vegetable">Vegetables</label>
                <br>
                <input type="radio" name="product" value="pot plants" id="pot plants"/>
                <label for="pot plants">Pot plants</label>
                <br>
                <input type="radio" name="product" value="cutflowers" id="cutFlowers"/>
                <label for="cutFlowers">Cut flowers</label>
                <br>
                <input type="radio" name="product" value="other" id="other"/>
                <label for="other">Other</label>
            </div>

            <!-- Add Postcode Input -->
            
    <div class="postcode-input mt-3">
        <label for="postcode" class="form-label">Enter your postcode:</label>
        <input type="text" class="form-control" id="postcode" placeholder="e.g., SW1A 1AA">
        <button class="btn btn-outline-success mt-2" id="sortByDistance">Sort by Distance</button>
    </div>

        </section>
    
        <section class="main-content container col">
            
            <!-- Add Product button -->
            <div class="row g-4 container" id="productContainer">
                <div class="col-md-4" id="productCard ">
                    
                    
            </div>
            </div>

        </section>
    </main>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true" data-product-id="">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header d-flex justify-content-between">
                    <div class="modal-title">
                        <h5 class="modal-title" id="productModalLabel">Product Details</h5>
                    </div>
                    <button type="button" class="btn btn-danger" id="deleteProductBtn">Delete Item</button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img src="" class="img-fluid product-image" id="modalProductImage" alt="Product Image">
                    <h4 id="modalProductTitle">Product Name</h5>
                    <h6 id="modalProductVariety">Product Variety</h6>
                    <p id="modalProductDescription">Product description goes here.</p>
                    <p id="modalProductPrice"><strong>Price: £</strong></p>

                    <div class="justify-content-between align-items-center">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1">
                    <i class='bx bx-cart bx-sm'></i>
                    <button id="addToCartBtn" class="btn btn-outline-success">Add to Cart</button>
                    </div>
                    <!-- Notification Container -->
                     <div id="notification" class="alert alert-success mt-3" role="alert" style="display: none;">
                        Product added to cart!
                     </div>

                </div>
                <div class="modal-body">
                    <h6>Comments</h6>
                    <div id="comments"></div>
                    <p><strong>Leave a comment about this product here:</strong></p>
                    <form class="comment-form" id="commentForm">
                        <textarea id="commentText" class="form-control comment-textarea" placeholder="Leave a comment" required></textarea>
                        <button type="submit" class="btn btn-outline-success">Submit</button>
                    </form>
                    <div id="commentsList"></div>
                </div>
            </div>
        </div>
    </div>


 <!-- Add Product Modal -->
 <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addProductModalLabel">Add New Product</h5>
                <button type="button" id="addProductCloseButton" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addProductForm">
                    
                    <div class="mb-3">
                        <label for="categoryDropdown" class="form-label">Select a Category</label>
                        <select class="form-control" id="categoryDropdown" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="fruit" data-id="1">Fruit</option>
                            <option value="vegetable" data-id="2">Vegetable</option>
                            <option value="potplants" data-id="3">Potted plant</option>
                            <option value="cutflowers" data-id="4">Cut flowers</option>
                            <option value="other" data-id="5">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="productType" class="form-label">Product Type</label>
                        <select class="form-control" id="typeDropdown" required>
                            <option value="" disabled selected>Select a type</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="productVariety" class="form-label">Variety:</label>
                        <input type="text" class="form-control" id="productVariety" placeholder="Enter variety..." required>
                    </div>
                    <div class="mb-3">
                        <label for="productDescription" class="form-label">Product Description</label>
                        <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="productImageUrl" class="form-label">Product Image URL</label>
                        <input type="file" class="form-control" id="    " accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <p>Suggested price range to list produce for sale at: </p>
                        <p id="priceRange"><strong></strong></p>
                    </div>
                    <div class="mb-3">
                        <label for="productPrice" id="productPriceLabel" class="form-label">Price (£)</label>
                        <input type="number" min="0" step="0.01" class="form-control" id="productPrice" required>
                    </div>
                    <button type="submit" class="btn btn-success">Add Product</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
